<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏聚合平台</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/hub.css">
</head>
<body>

<!-- ============ 顶部导航栏 ============ -->
<header class="hub-header">
  <div class="hub-header-left">
    <span class="hub-logo">🎮</span>
    <span class="hub-title">游戏聚合</span>
  </div>
  <div class="hub-header-right">
    <button id="hub-theme-toggle" class="btn btn-small" title="切换主题">🌓</button>
    <div id="hub-user-bar" class="hub-user-bar"></div>
  </div>
</header>

<!-- ============ 主体布局 ============ -->
<div class="hub-body">
  <!-- 左侧：游戏列表 / 登录 -->
  <main class="hub-main">
    <!-- 未登录时显示登录卡片 -->
    <section id="hub-login-section" class="hub-login-section" style="display:none;">
      <div class="login-card">
        <div class="login-logo">🎮</div>
        <h1>游戏聚合平台</h1>
        <p class="subtitle">登录后即可畅玩所有游戏</p>
        <div class="login-tabs">
          <button class="login-tab active" data-mode="account">账号登录</button>
          <button class="login-tab" data-mode="register">注册</button>
          <button class="login-tab" data-mode="guest">游客</button>
        </div>
        <div class="login-form" id="form-account">
          <div class="input-group">
            <label>用户名</label>
            <input type="text" id="login-username" placeholder="输入用户名" maxlength="20">
          </div>
          <div class="input-group">
            <label>密码</label>
            <input type="password" id="login-password" placeholder="输入密码" maxlength="32">
          </div>
          <button id="btn-account-login" class="btn btn-primary btn-large">登录</button>
        </div>
        <div class="login-form" id="form-register" style="display:none;">
          <div class="input-group">
            <label>用户名</label>
            <input type="text" id="reg-username" placeholder="至少3个字符" maxlength="20">
          </div>
          <div class="input-group">
            <label>密码</label>
            <input type="password" id="reg-password" placeholder="至少4个字符" maxlength="32">
          </div>
          <div class="input-group">
            <label>昵称</label>
            <input type="text" id="reg-nickname" placeholder="游戏内显示名称" maxlength="12">
          </div>
          <div class="input-group">
            <label>QQ 号（选填，获取头像）</label>
            <input type="text" id="reg-qq" placeholder="输入QQ号" maxlength="11">
          </div>
          <button id="btn-register" class="btn btn-primary btn-large">注册并登录</button>
        </div>
        <div class="login-form" id="form-guest" style="display:none;">
          <div class="input-group">
            <label>QQ 号（选填，获取头像）</label>
            <input type="text" id="guest-qq" placeholder="输入QQ号获取头像" maxlength="11">
          </div>
          <div class="input-group">
            <label>昵称</label>
            <input type="text" id="guest-nickname" placeholder="输入你的昵称" maxlength="12">
          </div>
          <button id="btn-guest-login" class="btn btn-primary btn-large">进入大厅</button>
        </div>
        <div class="avatar-preview" id="avatar-preview" style="display:none;">
          <img id="avatar-img" alt="头像">
          <span id="avatar-name"></span>
        </div>
        <p id="login-status" class="login-status"></p>
      </div>
    </section>

    <!-- 已登录时显示游戏列表 -->
    <section id="hub-games-section" style="display:none;">
      <h2 class="hub-section-title">🎮 全部游戏</h2>
      <div id="games-list" class="games-list">
        <!-- 游戏卡片由JS动态生成 -->
      </div>

      <!-- 我的战绩（按游戏类型分开） -->
      <h2 class="hub-section-title" style="margin-top:32px;">📊 我的战绩</h2>
      <div id="my-stats-list" class="my-stats-list">
        <!-- 由JS动态生成 -->
      </div>

      <!-- 最近对局（按游戏类型分开） -->
      <h2 class="hub-section-title" style="margin-top:32px;">📋 最近对局</h2>
      <div id="history-tabs" class="history-tabs"></div>
      <div id="history-list" class="history-list">
        <!-- 由JS动态生成 -->
      </div>
    </section>
  </main>

  <!-- 右侧侧边栏 -->
  <aside class="hub-sidebar">
    <!-- 在线统计 -->
    <div class="hub-sidebar-card">
      <h3>📊 在线统计</h3>
      <div class="hub-stats">
        <div class="hub-stat-item">
          <span class="hub-stat-value" id="stat-total-online">0</span>
          <span class="hub-stat-label">总在线</span>
        </div>
        <div class="hub-stat-item">
          <span class="hub-stat-value" id="stat-total-rooms">0</span>
          <span class="hub-stat-label">进行中</span>
        </div>
      </div>
    </div>

    <!-- 广告位 -->
    <div class="hub-sidebar-card" id="hub-ads-container" style="display:none;">
      <h3>📢 广告</h3>
      <div id="hub-ads"></div>
    </div>

    <!-- 友情链接 -->
    <div class="hub-sidebar-card" id="hub-links-container" style="display:none;">
      <h3>🔗 友情链接</h3>
      <div id="hub-links" class="hub-links-list"></div>
    </div>
  </aside>
</div>

<!-- ============ Toast 提示 ============ -->
<div id="toast-container"></div>

<script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
<script src="/js/config.js"></script>
<script src="/js/hub.js"></script>
</body>
</html>
